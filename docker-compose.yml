# Guarda os conteiners que formam o ecossistema da aplicação
# Cada service aqui vira um conteiner isolado em memória
services:
  web:
    # Seta o build do Docker Compose para o Dockerfile do diretório atual
    build: .
    # Mapeia as portas
    ports:
      - "8080:3000"
    environment:
      # IMPORTANTE: Usamos 'db' em vez de 'localhost' para o app achar o container do MongoDB
      - MONGO_URI=mongodb://admin:senha123@db:27017/compucell_tecnologias_assistencia_tecnica?authSource=admin
    # Garante a ordem de subida
    # Aqui a aplicação só inicializa depois que o conteiner do banco de dados estiver operacional
    depends_on:
      - db

  db:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: senha123
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./init.js:/docker-entrypoint-initdb.d/init.js

# Todas as inserções de dados no banco persistirão no seu HD real mesmo que o container seja destruído.
volumes:
  mongo-data: